<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #2563eb;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 20px;
        }

        .user-message {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-message .message-content {
            background: #2563eb;
            color: white;
        }

        .bot-message .message-content {
            background: #eef2f7;
            color: #222;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .input-area button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .input-area button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .disclaimer {
            padding: 8px 15px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>Medical AI Assistant</h1>
            <p>Ask questions about the provided medical document</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message bot-message">
                <div class="message-content">
                    Hello! Ask me a question about the medical document.
                </div>
            </div>

        </div>

        <div class="disclaimer">
            This assistant provides information from the provided document
            and is not a substitute for professional medical advice.
        </div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask a medical question..."
                onkeydown="handleKeyPress(event)"
            >

            <button
                id="askButton"
                onclick="askQuestion()"
            >
                Ask
            </button>

        </div>

    </div>

    <script>

        async function askQuestion() {

            const input = document.getElementById("question");
            const button = document.getElementById("askButton");
            const chatBox = document.getElementById("chatBox");

            const question = input.value.trim();

            if (!question) {
                return;
            }

            const userMessage = document.createElement("div");

            userMessage.className = "message user-message";

            userMessage.innerHTML = `
                <div class="message-content">
                    ${question}
                </div>
            `;

            chatBox.appendChild(userMessage);

            input.value = "";

            button.disabled = true;
            button.innerText = "Thinking...";

            const botMessage = document.createElement("div");

            botMessage.className = "message bot-message";

            botMessage.innerHTML = `
                <div class="message-content">
                    Thinking...
                </div>
            `;

            chatBox.appendChild(botMessage);

            try {

                const response = await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })

                });

                const data = await response.json();

                if (data.error) {

                    botMessage.querySelector(
                        ".message-content"
                    ).innerText = data.error;

                } else {

                    botMessage.querySelector(
                        ".message-content"
                    ).innerText = data.answer;

                }

            } catch (error) {

                botMessage.querySelector(
                    ".message-content"
                ).innerText =
                    "Something went wrong. Please try again.";

            }

            button.disabled = false;
            button.innerText = "Ask";

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {

            if (event.key === "Enter") {
                askQuestion();
            }

        }

    </script>

</body>

</html>
